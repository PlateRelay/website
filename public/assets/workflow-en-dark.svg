<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 136" width="964" height="136" role="img" aria-label="PlateRelay Core Workflow">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Nodes -->
  <rect x="16" y="16" width="108" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.75" />
  <text x="70" y="42" font-size="13" font-weight="500" fill="#ffffff">Submit File</text>

  <rect x="168" y="16" width="122" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.75" />
  <text x="229" y="42" font-size="13" font-weight="500" fill="#ffffff">Manual Review</text>

  <rect x="334" y="16" width="106" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.75" />
  <text x="387" y="42" font-size="13" font-weight="500" fill="#ffffff">Queueing</text>

  <rect x="484" y="16" width="134" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.75" />
  <text x="551" y="42" font-size="13" font-weight="500" fill="#ffffff">Dispatch &amp; Print</text>

  <rect x="662" y="16" width="128" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.75" />
  <text x="726" y="42" font-size="13" font-weight="500" fill="#ffffff">Shelve &amp; Clear</text>

  <rect x="834" y="16" width="114" height="52" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.75" />
  <text x="891" y="42" font-size="13" font-weight="500" fill="#ffffff">QR Pickup</text>

  <!-- Forward arrows -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 130 42 L 162 42 M 156 36 L 162 42 L 156 48" />
    <path d="M 296 42 L 328 42 M 322 36 L 328 42 L 322 48" />
    <path d="M 446 42 L 478 42 M 472 36 L 478 42 L 472 48" />
    <path d="M 624 42 L 656 42 M 650 36 L 656 42 L 650 48" />
    <path d="M 796 42 L 828 42 M 822 36 L 828 42 L 822 48" />

    <!-- Release printer loop -->
    <path d="M 726 74 L 726 104 Q 726 112 718 112 L 614 112" />
    <path d="M 498 112 L 395 112 Q 387 112 387 104 L 387 76 M 381 82 L 387 76 L 393 82" />
  </g>

  <text x="556" y="112" font-size="12.5" fill="#ffffff">Release Printer</text>
</svg>
