<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 136" width="964" height="136" role="img" aria-label="PlateRelay 核心业务流程">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Nodes -->
  <rect x="16" y="16" width="118" height="52" rx="8" fill="#e8f0fe" stroke="#4b7cf3" stroke-width="1.75" />
  <text x="75" y="42" font-size="14" font-weight="500" fill="#1f2937">提交打印文件</text>

  <rect x="190" y="16" width="94" height="52" rx="8" fill="#e8f0fe" stroke="#4b7cf3" stroke-width="1.75" />
  <text x="237" y="42" font-size="14" font-weight="500" fill="#1f2937">人工审核</text>

  <rect x="340" y="16" width="94" height="52" rx="8" fill="#e8f0fe" stroke="#4b7cf3" stroke-width="1.75" />
  <text x="387" y="42" font-size="14" font-weight="500" fill="#1f2937">队列调度</text>

  <rect x="490" y="16" width="94" height="52" rx="8" fill="#e8f0fe" stroke="#4b7cf3" stroke-width="1.75" />
  <text x="537" y="42" font-size="14" font-weight="500" fill="#1f2937">派单打印</text>

  <rect x="640" y="16" width="134" height="52" rx="8" fill="#e8f0fe" stroke="#4b7cf3" stroke-width="1.75" />
  <text x="707" y="42" font-size="14" font-weight="500" fill="#1f2937">入库与清床确认</text>

  <rect x="830" y="16" width="118" height="52" rx="8" fill="#e8f0fe" stroke="#4b7cf3" stroke-width="1.75" />
  <text x="889" y="42" font-size="14" font-weight="500" fill="#1f2937">凭码核销取件</text>

  <!-- Forward arrows -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 140 42 L 184 42 M 178 36 L 184 42 L 178 48" />
    <path d="M 290 42 L 334 42 M 328 36 L 334 42 L 328 48" />
    <path d="M 440 42 L 484 42 M 478 36 L 484 42 L 478 48" />
    <path d="M 590 42 L 634 42 M 628 36 L 634 42 L 628 48" />
    <path d="M 780 42 L 824 42 M 818 36 L 824 42 L 818 48" />

    <!-- Release printer loop -->
    <path d="M 707 74 L 707 104 Q 707 112 699 112 L 593 112" />
    <path d="M 501 112 L 395 112 Q 387 112 387 104 L 387 76 M 381 82 L 387 76 L 393 82" />
  </g>

  <text x="547" y="112" font-size="13" fill="#374151">释放打印机</text>
</svg>
